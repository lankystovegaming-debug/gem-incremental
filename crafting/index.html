
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="Craft pickaxes, boots and bags to improve your rolls.">

  <title>Crafting · Gem Incremental</title>

  <link rel="icon" type="image/x-icon" href="../src/assets/favicon.ico">
  <link rel="preload" as="font" type="font/woff2"
        href="../src/assets/fonts/exo2-latin.woff2" crossorigin>
  <link rel="stylesheet" href="../src/styles/app.css">
  <link rel="stylesheet" href="./crafting.css">

  <script>
    (function () {
      try {
        var mode = localStorage.getItem("gemIncremental.theme.mode");
        var accent = localStorage.getItem("gemIncremental.theme.accent");
        var allowedModes = ["light", "dark", "neon", "gradient", "ocean", "forest", "sunset", "ice", "aurora", "graphite"];

        if (allowedModes.indexOf(mode) !== -1) {
          document.documentElement.setAttribute("data-theme", mode);
        } else {
          document.documentElement.removeAttribute("data-theme");
        }

        document.documentElement.setAttribute(
          "data-accent",
          accent || "indigo"
        );
      } catch (error) {
        /* localStorage unavailable — defaults apply. */
      }
    })();
  </script>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"72a2f511dbb94268878b2aa1623ffe0d"}'></script>
  <!-- End Cloudflare Web Analytics -->
</head>

<body>
  <main class="app-main">
    <header class="page-head page-hero">
      <div class="page-head__title page-hero__content">
        <h1>Crafting</h1>
        <p class="page-head__sub page-hero__description" id="craftingSubtitle">Loading recipes…</p>
      </div>

      <div class="row page-hero__actions action-bar" id="hideOwnedRow">
        <label class="switch" title="Only show recipes you have not crafted yet">
          <input type="checkbox" id="hideOwned">
          <span class="switch__track"></span>
          <span>Hide crafted</span>
        </label>
      </div>
    </header>

    <section class="card crafting-next" id="craftingNext" aria-live="polite"></section>


    <!-- ================= AUTO CRAFT BANNER ================= -->

    <div id="autoCraftBanner" class="auto-banner hidden">
      <span id="autoCraftIcon" class="auto-banner__icon"></span>

      <div class="auto-banner__text">
        <strong>Auto Craft:</strong>
        <span id="autoCraftName">None</span>
        <span class="auto-banner__sub">
          Matching gems are deposited the moment you roll them.
        </span>
      </div>

      <button class="btn btn--sm" id="autoCraftClear" type="button">
        Turn off
      </button>
    </div>


    <!-- ================= CATEGORY TABS ================= -->

    <div class="segmented responsive-tabs crafting-tabs" role="tablist" aria-label="Crafting category">
      <button class="segmented__item" role="tab" type="button" aria-selected="true" data-crafting-group="pickaxes">
        Pickaxes
      </button>
      <button class="segmented__item" role="tab" type="button" aria-selected="false" data-crafting-group="specialists">Specialists</button>
      <button class="segmented__item" role="tab" type="button" aria-selected="false" data-crafting-group="secondary">Secondary</button>
      <button class="segmented__item" role="tab" type="button" aria-selected="false" data-crafting-group="others">Others</button>
      <button class="segmented__item" role="tab" type="button" aria-selected="false" data-crafting-group="limited-time">
        ⏳ Limited Time
      </button>
    </div>

    <div class="segmented responsive-tabs crafting-subtabs" role="tablist" aria-label="Specialist tier" data-subtabs="specialists" hidden>
      <button class="segmented__item" role="tab" type="button" aria-selected="true" data-subcategory="t15">T15</button>
      <button class="segmented__item" role="tab" type="button" aria-selected="false" data-subcategory="t16">T16</button>
    </div>

    <div class="segmented responsive-tabs crafting-subtabs" role="tablist" aria-label="Secondary equipment type" data-subtabs="secondary" hidden>
      <button class="segmented__item" role="tab" type="button" aria-selected="true" data-subcategory="clover">🍀 Clovers</button>
      <button class="segmented__item" role="tab" type="button" aria-selected="false" data-subcategory="lantern">Lanterns</button>
      <button class="segmented__item" role="tab" type="button" aria-selected="false" data-subcategory="boots">Boots</button>
      <button class="segmented__item" role="tab" type="button" aria-selected="false" data-subcategory="bag">Bags</button>
    </div>

    <div class="segmented responsive-tabs crafting-subtabs" role="tablist" aria-label="Other crafting type" data-subtabs="others" hidden>
      <button class="segmented__item" role="tab" type="button" aria-selected="true" data-subcategory="toys">🪣 Toys</button>
      <button class="segmented__item" role="tab" type="button" aria-selected="false" data-subcategory="petGear">🐾 Pet Gear</button>
      <button class="segmented__item" role="tab" type="button" aria-selected="false" data-subcategory="potion">Potions</button>
    </div>


    <div id="recipeList" class="recipe-list"></div>
  </main>

  <script type="module" src="./crafting.js"></script>
</body>
</html>
