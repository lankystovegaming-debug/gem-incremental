<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a101b">
  <meta name="description" content="Play the live Gem Incremental game. Your same account, gems, and progress.">
  <title>Gem Incremental</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0a101b; color: #e8f1ff; font: 14px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid #253448; }
    strong { font-size: 14px; }
    .gem { color: #75e7c4; margin-right: 7px; }
    .live { color: #9cb2cb; font-size: 12px; }
    a { margin-left: auto; color: #b2eedc; text-decoration: none; border: 1px solid #38584f; padding: 7px 11px; border-radius: 7px; }
    a:hover { background: #19362f; }
    a:focus-visible { outline: 2px solid #75e7c4; outline-offset: 3px; }
    iframe { display: block; width: 100%; flex: 1; min-height: 0; border: 0; background: #0a101b; }
    @media (max-width: 520px) { header { gap: 8px; padding: 8px 10px; } .live { display: none; } }
  </style>
</head>
<body>
  <header>
    <strong><span class="gem" aria-hidden="true">◆</span>Gem Incremental</strong>
    <span class="live">Live from gemincremental.com</span>
    <a href="https://gemincremental.com/" target="_blank" rel="noopener noreferrer">Open game ↗</a>
  </header>
  <iframe src="https://gemincremental.com/" title="Gem Incremental live game" allow="fullscreen; clipboard-write" allowfullscreen></iframe>
</body>
</html>
