<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="Create an account, set a username and keep your save across devices.">

  <title>Account · Gem Incremental</title>

  <link rel="icon" type="image/x-icon" href="../src/assets/favicon.ico">
  <link rel="preload" as="font" type="font/woff2"
        href="../src/assets/fonts/exo2-latin.woff2" crossorigin>
  <link rel="stylesheet" href="../src/styles/app.css">
  <link rel="stylesheet" href="./account.css">

  <script>
    (function () {
      try {
        var mode = localStorage.getItem("gemIncremental.theme.mode");
        var accent = localStorage.getItem("gemIncremental.theme.accent");

        var allowedModes = ["light", "dark", "neon", "gradient", "ocean", "forest", "sunset", "ice", "aurora", "graphite"];

        if (allowedModes.indexOf(mode) !== -1) {
          document.documentElement.setAttribute("data-theme", mode);
        } else {
          document.documentElement.removeAttribute("data-theme");
        }

        document.documentElement.setAttribute(
          "data-accent",
          ["indigo", "emerald", "amber", "rose", "cyan"].indexOf(accent) !== -1
            ? accent
            : "indigo"
        );
      } catch (error) {
        /* localStorage unavailable — defaults apply. */
      }
    })();
  </script>
</head>

<body>
  <main class="app-main app-main--narrow">
    <div class="page-head">
      <div class="page-head__title">
        <h1>Account</h1>
        <p class="page-head__sub">
          An account keeps your save if you clear this browser or
          switch device. Your player and every gem on it stay the same.
        </p>
      </div>
    </div>

    <section id="accountCard" class="card account-card">
      <div class="skeleton" style="height:28px;width:180px"></div>
      <div class="skeleton" style="height:14px;margin-top:14px"></div>
      <div class="skeleton" style="height:14px;margin-top:8px;width:70%"></div>
    </section>

    <p id="accountStatus" class="account-status"></p>
  </main>

  <script type="module">
    import { mountShell } from "../src/ui/shell.js";
    import { loadCloudPlayerState } from "../src/backend/cloudInventory.js";

    const shell = mountShell({ page: "account", base: "../" });

    loadCloudPlayerState().then((state) => {
      if (state) {
        shell.setWallet(state.money);
      }
    });
  </script>

  <script type="module" src="./account.js"></script>
</body>
</html>
