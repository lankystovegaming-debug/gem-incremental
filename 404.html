<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0e14">
<title>404 Not Found · Gem Incremental</title>
<link rel="stylesheet" href="/error.css">
<script>
(function(){
  try {
    const mode=localStorage.getItem("gemIncremental.theme.mode");
    if(["light","dark","neon"].includes(mode)) document.documentElement.setAttribute("data-theme",mode);
  } catch(e) {}
})();
</script>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"72a2f511dbb94268878b2aa1623ffe0d"}'></script>
  <!-- End Cloudflare Web Analytics -->
</head>
<body>
<main class="app-main">
  <section class="error-card" aria-labelledby="errorTitle">
    <h1 class="error-code" id="errorTitle">404 Not Found</h1>
  </section>
</main>

<script>
(function () {
  // Static hosts bootstrap dynamic routes in-place, preserving the URL.
  const path = window.location.pathname.replace(/\/+$/, "");
  const profile = /^\/user\/[^/]+$/.test(path);
  const recap = /^\/recap\/month[1-9][0-9]*$/.test(path);
  if (!profile && !recap) return;

  fetch(profile ? "/user/index.html" : "/recap/index.html", { cache: "no-store" })
    .then((response) => {
      if (!response.ok) throw new Error("Page shell unavailable");
      return response.text();
    })
    .then((pageHtml) => {
      document.open();
      document.write(pageHtml);
      document.close();
    })
    .catch((error) => {
      console.error("[PAGE ROUTER]", error);
    });
})();
</script>

</body>
</html>
