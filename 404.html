<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0e14">
<title>Gem Incremental</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/error.css">
<script>
(function(){
  try {
    const mode=localStorage.getItem("gemIncremental.theme.mode");
    if(["light","dark","neon"].includes(mode)) document.documentElement.setAttribute("data-theme",mode);
  } catch(e) {}
})();
</script>
</head>
<body data-error-page="true" style="visibility:hidden">
<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="/" aria-label="Gem Incremental home">
      <span class="brand__mark">◆</span>
      <span class="brand__name">Gem Incremental</span>
    </a>
    <nav class="nav" aria-label="Primary"><a class="nav__link" href="/">Roll</a><a class="nav__link" href="inventory/">Inventory</a><a class="nav__link" href="crafting/">Crafting</a><a class="nav__link" href="boosts/">Shop</a><a class="nav__link" href="gem-index/">Gem Index</a><a class="nav__link" href="leaderboards/">Leaderboards</a></nav>
    <div class="topbar__spacer"></div>
    <div class="topbar__tools">
      <span class="wallet" title="Money">◈<span>—</span></span>
      <a class="btn btn--ghost btn--icon" href="settings/" title="Settings" aria-label="Settings">⚙</a>
      <button class="btn btn--ghost btn--icon" type="button" title="Appearance" aria-label="Appearance settings" onclick="cycleTheme()">◐</button>
      <button class="account-btn" type="button" aria-label="Account: Guest">
        <span class="avatar">?</span><span class="account-btn__name">Guest</span>
      </button>
    </div>
  </div>
</header>
<main class="app-main">
  <section class="error-card" aria-labelledby="errorTitle">
    <p class="error-code" aria-label="Error 404">404</p>
    <h1 class="error-title" id="errorTitle">Not Found</h1>
    <p class="error-message">The page you&#x27;re looking for doesn&#x27;t exist.</p>
    <div class="error-actions">
      <a class="roll-back" href="/">Back to Rolling</a>
    </div>
    <p class="footer-note">Gem Incremental</p>
  </section>
</main>
<script>
(function () {
  "use strict";

  // GitHub Pages and other static hosts cannot create an arbitrary
  // /user/<uuid>/ directory at request time. They serve this 404 document
  // instead. For profile URLs, turn that 404 response into the real profile
  // page while keeping the requested URL visible in the address bar.
  const PROFILE_PATH = /^\/user\/([0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})\/?$/i;
  const match = window.location.pathname.match(PROFILE_PATH);

  if (!match) {
    document.body.style.visibility = "visible";
    return;
  }

  const profileId = match[1];
  const PROFILE_SHELL = "/user/index.html";
  const PROFILE_SCRIPT = "/user/profile.js";

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function showProfileFallback(message) {
    document.body.style.visibility = "visible";
    document.body.innerHTML = `
      <main style="min-height:100vh;display:grid;place-items:center;padding:32px;font-family:system-ui,sans-serif;background:#080b12;color:#eef3ff">
        <section style="max-width:620px;width:100%;padding:32px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(20,25,38,.9);box-shadow:0 20px 70px rgba(0,0,0,.35)">
          <p style="opacity:.65;letter-spacing:.12em;text-transform:uppercase;font-size:12px">Gem Incremental</p>
          <h1 style="margin:8px 0 12px">Profile could not be loaded</h1>
          <p style="opacity:.75;line-height:1.6">${escapeHtml(message)}</p>
          <a href="/" style="display:inline-block;margin-top:18px;padding:11px 16px;border-radius:10px;background:#25c7e8;color:#071018;text-decoration:none;font-weight:700">Back to Gem Incremental</a>
        </section>
      </main>
    `;
  }

  async function bootProfile() {
    try {
      const response = await fetch(PROFILE_SHELL, {
        cache: "no-store",
        headers: { "Accept": "text/html" }
      });

      if (!response.ok) {
        throw new Error(`Profile shell returned HTTP ${response.status}.`);
      }

      const html = await response.text();
      const parsed = new DOMParser().parseFromString(html, "text/html");

      // Keep the exact /user/<uuid>/ URL. profile.js reads the UUID directly
      // from window.location.pathname.
      document.title = parsed.title || `Profile · ${profileId}`;
      document.documentElement.replaceChildren(...Array.from(parsed.documentElement.children).map((node) => node.cloneNode(true)));

      // The cloned document does not execute scripts automatically. Import
      // the profile module explicitly after the document has been replaced.
      await import(PROFILE_SCRIPT);
    } catch (error) {
      console.error("[PROFILE ROUTING] Failed to load profile:", error);
      showProfileFallback(error instanceof Error ? error.message : "Unknown profile loading error.");
    }
  }

  bootProfile();
})();
</script>
<script>
function cycleTheme(){
  const modes=["system","light","dark","neon"];
  const current=localStorage.getItem("gemIncremental.theme.mode")||"system";
  const next=modes[(modes.indexOf(current)+1)%modes.length];
  if(next==="system"){localStorage.removeItem("gemIncremental.theme.mode");document.documentElement.removeAttribute("data-theme");}
  else{localStorage.setItem("gemIncremental.theme.mode",next);document.documentElement.setAttribute("data-theme",next);}
}
</script>
</body>
</html>
