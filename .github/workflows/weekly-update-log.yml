name: Weekly player update log
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, closed]
permissions:
  contents: read
jobs:
  validate:
    if: startsWith(github.event.pull_request.title, 'weekly update ') && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/publish-weekly-update.mjs --check
  publish:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'weekly update ') && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-weekly-update-log
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Publish the merged weekly notes
        run: |
          node tools/publish-weekly-update.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/history.json docs/update-log-pr-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish merged weekly player update log'
          git push
