<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="Redeem Gem Incremental promotional codes.">
  <title>Codes · Gem Incremental</title>
  <link rel="icon" type="image/x-icon" href="../src/assets/favicon.ico">
  <link rel="stylesheet" href="../src/styles/app.css">
  <link rel="stylesheet" href="./codes.css">
  <script>
    (function(){try{var m=localStorage.getItem("gemIncremental.theme.mode");var a=localStorage.getItem("gemIncremental.theme.accent");if(["light","dark","neon"].includes(m))document.documentElement.setAttribute("data-theme",m);document.documentElement.setAttribute("data-accent",a||"indigo")}catch(e){}})();
  </script>
</head>
<body>
  <main class="app-main codes-page">
    <section class="codes-card card">
      <div class="codes-icon" id="codesIcon"></div>
      <p class="codes-eyebrow">Promotional codes</p>
      <h1>Redeem a code</h1>
      <p class="codes-copy">Enter an official Gem Incremental code to receive its money or potion rewards.</p>

      <form id="codeForm" class="codes-form">
        <label class="field">
          <span>Code</span>
          <input id="codeInput" type="text" minlength="3" maxlength="32"
            autocomplete="off" autocapitalize="characters" spellcheck="false"
            placeholder="ENTER-CODE" required>
        </label>
        <button id="redeemButton" class="btn btn--primary" type="submit">Redeem</button>
      </form>

      <div id="codeResult" class="codes-result" hidden></div>
      <p class="codes-note">Each code can only be redeemed once per account.</p>
    </section>
  </main>
  <script type="module" src="./codes.js"></script>
</body>
</html>
