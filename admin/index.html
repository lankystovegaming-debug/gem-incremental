<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0e14">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin · Gem Incremental</title>
  <link rel="icon" type="image/x-icon" href="../src/assets/favicon.ico">
  <link rel="stylesheet" href="../src/styles/app.css">
  <link rel="stylesheet" href="./admin.css">
  <script>
    (function(){try{var m=localStorage.getItem("gemIncremental.theme.mode");var a=localStorage.getItem("gemIncremental.theme.accent");if(["light","dark","neon","gradient","ocean","forest","sunset","ice"].includes(m))document.documentElement.setAttribute("data-theme",m);document.documentElement.setAttribute("data-accent",a||"indigo")}catch(e){}})();
  </script>
</head>
<body>
  <main class="app-main">
    <div class="page-head">
      <div class="page-head__title">
        <h1>Admin Panel</h1>
        <p class="page-head__sub" id="adminStatus">Verifying administrator access…</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="analyticsButton" type="button" disabled>Analytics</button><button class="btn" id="auditButton" type="button" disabled>Audit log</button></div>
    </div>

    <section class="card admin-search">
      <label class="field">
        <span>Find a player</span>
        <input id="playerSearch" type="search" autocomplete="off"
          placeholder="Username, email, or Player ID">
      </label>
      <button class="btn btn--primary" id="searchButton" type="button" disabled>Search</button>
    </section>

    <section class="card admin-announce" id="announcePanel" hidden>
      <h2>Announcements</h2>
      <p class="page-head__sub">
        Posted to the top of the game for every player, including guests.
      </p>

      <textarea
        id="announceBody"
        class="admin-textarea"
        rows="2"
        maxlength="500"
        placeholder="e.g. Maintenance at 8pm — rolls may be briefly unavailable."
      ></textarea>

      <div class="admin-control" style="margin-top:12px">
        <select id="announceTone" class="select">
          <option value="info">Info</option>
          <option value="positive">Good news</option>
          <option value="warning">Warning</option>
        </select>
        <button class="btn btn--primary" id="announcePost" type="button">Post announcement</button>
        <button class="btn btn--danger" id="announceClear" type="button">Clear all</button>
      </div>

      <p class="account-status" id="announceStatus"></p>
    </section>

    <section class="card admin-codes" id="codesPanel" hidden>
      <div class="admin-section-head">
        <div>
          <h2>Promotional Codes</h2>
          <p class="page-head__sub">Create codes for money, potions, or both.</p>
        </div>
        <button class="btn" id="codesRefresh" type="button">Refresh</button>
      </div>

      <div class="admin-code-form">
        <label class="field"><span>Code</span><input id="newCode" maxlength="32" placeholder="WELCOME"></label>
        <label class="field"><span>Money</span><input id="codeMoney" type="number" min="0" step="0.01" value="0"></label>
        <label class="field"><span>Potion</span><select id="codePotion"></select></label>
        <label class="field"><span>Quantity</span><input id="codePotionQuantity" type="number" min="0" step="1" value="0"></label>
        <label class="field"><span>Expires (optional)</span><input id="codeExpires" type="datetime-local"></label>
        <label class="field"><span>Use limit (optional)</span><input id="codeLimit" type="number" min="1" step="1" placeholder="Unlimited"></label>
        <button class="btn btn--primary" id="codeCreate" type="button">Create code</button>
      </div>

      <div class="admin-code-list" id="codesList"></div>
    </section>

    <section class="card admin-events" id="eventsPanel" hidden>
      <div class="admin-section-head">
        <div>
          <h2>Admin Events</h2>
          <p class="page-head__sub">Owner-only global boosts. Starting an event stops the current one.</p>
        </div>
        <button class="btn" id="eventsRefresh" type="button">Refresh</button>
      </div>

      <div class="admin-event-form">
        <label class="field"><span>Event name</span><input id="eventName" maxlength="80" placeholder="Lucky Hour"></label>
        <label class="field"><span>Duration (minutes)</span><input id="eventDuration" type="number" min="1" max="10080" step="1" value="60"></label>
        <label class="field"><span>Luck bonus (%)</span><input id="eventLuck" type="number" min="0" step="1" value="0"></label>
        <label class="field"><span>Roll speed bonus (%)</span><input id="eventRollSpeed" type="number" min="0" step="1" value="0"></label>
        <label class="field"><span>Weight luck bonus (%)</span><input id="eventWeightLuck" type="number" min="0" step="1" value="0"></label>
        <label class="field"><span>Weight multiplier bonus (%)</span><input id="eventWeightMultiplier" type="number" min="0" step="1" value="0"></label>
        <label class="field"><span>Luck multiplier (×)</span><input id="eventLuckMultiplier" type="number" min="0.01" max="10000" step="0.01" value="1"></label>
        <label class="field"><span>Roll speed multiplier (×)</span><input id="eventRollSpeedMultiplier" type="number" min="0.01" max="10000" step="0.01" value="1"></label>
        <label class="field"><span>Weight luck multiplier (×)</span><input id="eventWeightLuckMultiplier" type="number" min="0.01" max="10000" step="0.01" value="1"></label>
        <label class="field"><span>Weight multiplier multiplier (×)</span><input id="eventWeightMultiplierMultiplier" type="number" min="0.01" max="10000" step="0.01" value="1"></label>
        <button class="btn btn--primary" id="eventStart" type="button">Start event</button>
      </div>

      <div class="admin-event-list" id="eventsList"></div>
    </section>

    <section class="card admin-analytics" id="analyticsPanel" hidden>
      <div class="admin-section-head">
        <div>
          <h2>Analytics</h2>
          <p class="page-head__sub" id="analyticsGenerated">Not loaded yet</p>
        </div>
        <button class="btn" id="analyticsRefresh" type="button">Refresh</button>
      </div>
      <div id="analyticsContent" class="analytics-content"></div>
    </section>

    <section id="searchResults" class="admin-results"></section>
    <section id="playerPanel" class="hidden"></section>
    <section id="auditPanel" class="hidden"></section>
  </main>
  <script type="module" src="./admin.js"></script>
</body>
</html>
