<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="See the latest features, improvements, and fixes added to Gem Incremental.">

  <title>Update Log · Gem Incremental</title>

  <link rel="icon" type="image/x-icon" href="../src/assets/favicon.ico">
  <link rel="preload" as="font" type="font/woff2"
        href="../src/assets/fonts/exo2-latin.woff2" crossorigin>
  <link rel="stylesheet" href="../src/styles/app.css">
  <link rel="stylesheet" href="./updates.css">

  <script>
    (function () {
      try {
        var mode = localStorage.getItem("gemIncremental.theme.mode");
        var accent = localStorage.getItem("gemIncremental.theme.accent");
        var allowedModes = ["light", "dark", "neon", "gradient", "ocean", "forest", "sunset", "ice", "aurora", "graphite"];

        if (allowedModes.indexOf(mode) !== -1) {
          document.documentElement.setAttribute("data-theme", mode);
        } else {
          document.documentElement.removeAttribute("data-theme");
        }
        document.documentElement.setAttribute(
          "data-accent",
          ["indigo", "emerald", "amber", "rose", "cyan"].indexOf(accent) !== -1
            ? accent
            : "indigo"
        );
      } catch (error) {}
    })();
  </script>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"72a2f511dbb94268878b2aa1623ffe0d"}'></script>
  <!-- End Cloudflare Web Analytics -->
</head>

<body>
  <main class="app-main updates-page">
    <div class="page-head updates-head">
      <div class="page-head__title">
        <p class="updates-head__eyebrow">What's new</p>
        <h1>Update Log</h1>
        <p class="page-head__sub">New features, improvements, balance changes, and bug fixes.</p>
      </div>
    </div>

    <label class="updates-search" for="updateSearch">Find an update
      <input id="updateSearch" type="search" placeholder="Search gems, equipment, fixes…" autocomplete="off">
    </label>
    <p id="updateStatus" role="status">Loading updates…</p>
    <section class="updates-list" id="publishedUpdates" aria-label="Gem Incremental updates"></section>
    <button class="btn" id="moreUpdates" type="button" hidden>Show older updates</button>
  </main>

  <script type="module" src="./updates.js"></script>
</body>
</html>
