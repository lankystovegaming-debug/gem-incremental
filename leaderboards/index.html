<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Leaderboards - Gem Incremental
  </title>

  <link
    rel="stylesheet"
    href="/leaderboards/leaderboards.css"
  >
</head>

<body>
  <main class="page">
    <div class="page-header">
      <div>
        <h1>
          Leaderboards
        </h1>

        <p class="subtitle">
          See how players rank across
          Gem Incremental.
        </p>
      </div>

      <a
        class="back-link"
        href="/"
      >
        Back to Rolling
      </a>
    </div>


    <div
      id="leaderboardStatus"
      class="status"
    ></div>


    <div class="tabs">
      <button
        id="totalRollsTab"
        class="tab-button active"
        type="button"
      >
        Total Rolls
      </button>

      <button
        id="rarestGemTab"
        class="tab-button"
        type="button"
      >
        Rarest Gem
      </button>

      <button
        id="lifetimeEarningsTab"
        class="tab-button"
        type="button"
      >
        Lifetime Earnings
      </button>
    </div>


    <section
      id="leaderboardCard"
      class="leaderboard-card"
    >
      <p>
        Loading leaderboard...
      </p>
    </section>
  </main>


  <script
    type="module"
    src="/leaderboards/leaderboards.js"
  ></script>
</body>
</html>
