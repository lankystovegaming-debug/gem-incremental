<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="See how players rank across Gem Incremental.">

  <title>Leaderboards · Gem Incremental</title>

  <link rel="icon" type="image/x-icon" href="../src/assets/favicon.ico">
  <link rel="preload" as="font" type="font/woff2"
        href="../src/assets/fonts/exo2-latin.woff2" crossorigin>
  <link rel="stylesheet" href="../src/styles/app.css">
  <link rel="stylesheet" href="./leaderboards.css">

  <script>
    (function () {
      try {
        var mode = localStorage.getItem("gemIncremental.theme.mode");
        var accent = localStorage.getItem("gemIncremental.theme.accent");

        var allowedModes = ["light", "dark", "neon", "gradient", "ocean", "forest", "sunset", "ice"];

        if (allowedModes.indexOf(mode) !== -1) {
          document.documentElement.setAttribute("data-theme", mode);
        } else {
          document.documentElement.removeAttribute("data-theme");
        }

        document.documentElement.setAttribute(
          "data-accent",
          ["indigo", "emerald", "amber", "rose", "cyan"].indexOf(accent) !== -1
            ? accent
            : "indigo"
        );
      } catch (error) {
        /* localStorage unavailable — defaults apply. */
      }
    })();
  </script>
</head>

<body>
  <main class="app-main">
    <div class="page-head">
      <div class="page-head__title">
        <h1>Leaderboards</h1>
        <p class="page-head__sub">
          How you rank against every other player.
        </p>
      </div>
    </div>

    <div id="leaderboardStatus" class="status"></div>

    <div class="segmented tabs" role="tablist" aria-label="Leaderboard">
      <button
        id="totalRollsTab"
        class="segmented__item tab-button active"
        role="tab"
        type="button"
      >
        Total Rolls
      </button>

      <button
        id="rarestGemTab"
        class="segmented__item tab-button"
        role="tab"
        type="button"
      >
        Rarest Gem
      </button>

      <button
        id="lifetimeEarningsTab"
        class="segmented__item tab-button"
        role="tab"
        type="button"
      >
        Lifetime Earnings
      </button>

      <button
        id="gemsFoundTab"
        class="segmented__item tab-button"
        role="tab"
        type="button"
      >
        Gems Found
      </button>
    </div>

    <section id="leaderboardCard" class="card leaderboard-card">
      <div class="skeleton" style="height:56px"></div>
      <div class="skeleton" style="height:44px;margin-top:10px"></div>
      <div class="skeleton" style="height:44px;margin-top:10px"></div>
    </section>
  </main>

  <script type="module">
    import { mountShell } from "../src/ui/shell.js";
    import { loadCloudPlayerState } from "../src/backend/cloudInventory.js";

    const shell = mountShell({ page: "leaderboards", base: "../" });

    loadCloudPlayerState().then((state) => {
      if (state) {
        shell.setWallet(state.money);
      }
    });
  </script>

  <script type="module" src="./leaderboards.js"></script>
</body>
</html>
