<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="Roll for gems, build a collection, craft equipment and chase the rarest specimens in this incremental mining game.">

  <meta property="og:title" content="Gem Incremental">
  <meta property="og:description" content="Roll for gems, craft equipment and chase the rarest specimens.">
  <meta property="og:type" content="website">

  <title>Gem Incremental</title>

  <link rel="icon" type="image/x-icon" href="./src/assets/favicon.ico">
  <link rel="preload" as="font" type="font/woff2"
        href="./src/assets/fonts/exo2-latin.woff2" crossorigin>
  <link rel="stylesheet" href="./src/styles/app.css">
  <link rel="stylesheet" href="./updates/updates.css">
  <link rel="stylesheet" href="./landing.css">

  <script>
    // Paint the saved theme before first render.
    (function () {
      try {
        var mode = localStorage.getItem("gemIncremental.theme.mode");
        var accent = localStorage.getItem("gemIncremental.theme.accent");

        var allowedModes = ["light", "dark", "neon", "gradient", "ocean", "forest", "sunset", "ice", "aurora", "graphite"];

        if (allowedModes.indexOf(mode) !== -1) {
          document.documentElement.setAttribute("data-theme", mode);
        } else {
          document.documentElement.removeAttribute("data-theme");
        }

        document.documentElement.setAttribute(
          "data-accent",
          ["indigo", "emerald", "amber", "rose", "cyan"].indexOf(accent) !== -1
            ? accent
            : "indigo"
        );
      } catch (error) {
        /* localStorage unavailable — defaults apply. */
      }
    })();
  </script>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"72a2f511dbb94268878b2aa1623ffe0d"}'></script>
  <!-- End Cloudflare Web Analytics -->
</head>

<body class="landing-page">
  <main class="landing" aria-labelledby="landingTitle">
    <a class="landing__brand" href="./">GEM INCREMENTAL</a>
    <div class="landing__gem" aria-hidden="true">◆</div>
    <p class="landing__eyebrow">Your next discovery awaits</p>
    <h1 id="landingTitle" role="status" aria-live="polite">Loading player data...</h1>
    <p id="landingDetail" class="landing__detail">Getting everything ready for you.</p>
    <div id="landingActions" class="landing__actions" hidden>
      <a id="landingPrimary" class="btn btn--primary" href="./roll/">Play</a>
      <button id="changelogButton" class="btn" type="button">Changelog</button>
    </div>
    <a id="landingLogin" class="landing__login" href="./account/" hidden>Already have an account? Log In</a>
    <button id="landingRetry" class="btn" type="button" hidden>Try again</button>
    <noscript><p>Enable JavaScript to load your player data.</p><a href="./account/">Log in or create an account</a></noscript>
  </main>
  <footer class="landing-tip" aria-label="Random tip or fun fact">
    <p id="landingTip">Tip: Lock gems you want to keep before selling from your inventory.</p>
  </footer>
  <dialog id="latestUpdate" class="landing-changelog" aria-labelledby="changelogTitle">
    <header class="landing-changelog__header">
      <h2 id="changelogTitle">Latest weekly update</h2>
      <button id="closeChangelog" class="btn btn--sm" type="button" autofocus>Close</button>
    </header>
    <div id="changelogContent" role="status"></div>
  </dialog>
  <script type="module" src="./src/ui/landingTip.js"></script>
  <script type="module" src="./landing.js"></script>
</body>
</html>
