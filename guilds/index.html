<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guilds · Gem Incremental</title><link rel="stylesheet" href="../src/styles/app.css"><style>body{background:radial-gradient(circle at 20% 0%,rgba(110,90,255,.18),transparent 35%),radial-gradient(circle at 90% 10%,rgba(0,220,190,.12),transparent 35%)}.page-wrap{max-width:1100px;margin:0 auto;padding:32px 18px}.hero{padding:28px;border:1px solid var(--border);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));backdrop-filter:blur(18px);margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.cardx{padding:20px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));box-shadow:0 15px 50px rgba(0,0,0,.16)}.muted{opacity:.7}.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#7c5cff,#22e0c0);border-radius:99px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:999px;background:rgba(124,92,255,.16)}input,select,textarea{width:100%;box-sizing:border-box;margin-top:6px}.form{display:grid;gap:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{cursor:pointer}.hidden{display:none}</style></head><body><main class="page-wrap"><section class="hero"><div class="muted">SOCIAL</div><h1>Guilds</h1><p>Create a guild, invite players, earn points from every roll and build guild quests.</p></section><div id="status" class="muted"></div><section id="create" class="cardx form"><h2>Create a guild</h2><input id="guildName" placeholder="Guild name"><button id="createBtn" class="btn btn--primary">Create Guild</button></section><section id="guild" class="hidden"><div class="cardx"><div class="row"><div><h2 id="guildTitle"></h2><p id="guildMeta" class="muted"></p></div><span class="pill" id="guildPoints"></span></div></div><div class="grid" style="margin-top:14px"><div class="cardx"><h2>Members</h2><div id="members"></div></div><div class="cardx" id="ownerTools"><h2>Owner tools</h2><div class="form"><input id="invitePlayer" placeholder="Player ID to invite"><button id="inviteBtn" class="btn">Invite</button><h3>Guild quest</h3><input id="qName" placeholder="Quest name"><textarea id="qDesc" placeholder="Description"></textarea><input id="qAmount" type="number" value="100" placeholder="Guild points required"><input id="qReward" type="number" value="10" placeholder="Reward guild points"><button id="qSave" class="btn btn--primary">Add Quest</button></div></div></div><div class="cardx" style="margin-top:14px"><h2>Guild quests</h2><div id="quests" class="grid"></div></div></section><section id="invites" class="cardx" style="margin-top:14px"><h2>Invitations</h2><div id="inviteList"></div></section></main><script type="module" src="./guilds.js"></script></body></html>
