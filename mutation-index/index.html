<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mutation Index · Gem Incremental</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="./mutation-index.css">
</head>
<body class="mutation-index-body">
  <main class="mutation-index-page" id="mutationIndexPage">
    <section class="mutation-index-hero" aria-labelledby="mutationIndexTitle">
      <div class="mutation-index-hero__copy">
        <div class="mutation-index-kicker">GEM CATALOG</div>
        <h1 id="mutationIndexTitle">Mutation Index</h1>
        <p>Every obtainable mutation in one clean catalog, ordered from the smallest multiplier to the largest.</p>
      </div>
      <div class="mutation-index-hero__meta">
        <strong id="mutationCount">—</strong><span>obtainable mutations</span>
      </div>
    </section>
    <section class="mutation-index-toolbar" aria-label="Mutation catalog controls">
      <label class="mutation-index-search"><span>Search</span><input id="mutationSearch" type="search" placeholder="Search mutations…" autocomplete="off"></label>
      <div class="mutation-index-sort">Sorted by <strong>multiplier ↑</strong></div>
    </section>
    <div id="list" class="mutation-index-grid" aria-live="polite"></div>
  </main>
  <script type="module" src="./index.js"></script>
</body>
</html>
