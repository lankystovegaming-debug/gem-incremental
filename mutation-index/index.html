<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Discover every mutation in Gem Incremental and track how many times you have rolled each one."><title>Mutation Index · Gem Incremental</title><link rel="stylesheet" href="../style.css?v=20260910"><link rel="stylesheet" href="./mutation-index.css?v=20260910-discoveries"></head>
<body class="mutation-index-body"><main class="mutation-index-page" id="mutationIndexPage">
<section class="mutation-index-hero" aria-labelledby="mutationIndexTitle"><div><div class="mutation-index-kicker">PERSONAL DISCOVERY LOG</div><h1 id="mutationIndexTitle">Mutation Index</h1><p>Mutation details remain hidden until you roll them. Every discovery is recorded across all gems and combinations.</p></div><div class="mutation-index-hero__count"><strong id="mutationCount">—</strong><span>obtainable mutations</span></div></section>
<section class="mutation-index-summary" aria-label="Mutation discovery summary"><div><span>Mutations discovered</span><strong id="discoveredCount">—</strong></div><div><span>Total mutation discoveries</span><strong id="totalDiscoveries">—</strong></div><div><span>Rarest discovered chance</span><strong id="rarestMutation">—</strong></div></section>

<p id="catalogStatus" class="mutation-index-status" aria-live="polite">Loading the live mutation catalog…</p><div id="list" class="mutation-index-grid" aria-live="polite" aria-busy="true"><div class="mutation-index-loading"><span></span><span></span><span></span></div></div>
</main><script type="module" src="./index.js?v=20260910-discoveries"></script></body></html>
